name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write # cache-nix-action purges stale caches
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-primary-key: never

      # Builds the package and runs the checks: clippy, nextest, doctests and
      # rustdoc.
      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Build package
        run: nix build --print-build-logs

  # update-flake.yml dispatches this workflow on its PR branch; merge the PR
  # once the checks are green, but only if the branch hasn't moved since.
  automerge-flake-update:
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref_name == 'automation/update-flake-lock'
      && github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge flake update PR
        run: >-
          gh pr merge automation/update-flake-lock
          --squash --delete-branch
          --match-head-commit "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
